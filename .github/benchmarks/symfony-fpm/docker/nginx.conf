resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    set $upstream fpm-baseline:9000;
    location / { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/public/index.php; fastcgi_pass $upstream; }
}
server {
    listen 8081;
    set $upstream fpm-base:9000;
    location / { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/public/index.php; fastcgi_pass $upstream; }
}
server {
    listen 8082;
    set $upstream fpm-head:9000;
    location / { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/public/index.php; fastcgi_pass $upstream; }
}
server {
    listen 8083;
    set $upstream prof-base:9000;
    location / { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/public/index.php; fastcgi_pass $upstream; }
}
server {
    listen 8084;
    set $upstream prof-head:9000;
    location / { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/public/index.php; fastcgi_pass $upstream; }
}
